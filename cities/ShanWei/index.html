<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>汕尾</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h2 {
      margin-top: 40px;
      margin-bottom: 10px;
      border-left: 4px solid #4caf50;
      padding-left: 10px;
      color: #333;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    figure {
      margin: 0;
    }

    figure img {
      width: 100%;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>

<body>

<h1>汕尾</h1>

<!-- Day 0 -->
<h2>Day 0</h2>
<div class="gallery">
  <figure><img src="images/0.jpg"></figure>
</div>

<!-- Day 1 -->
<h2>Day 1</h2>
<div class="gallery">
  <figure><img src="images/1.jpg"></figure>
  <figure><img src="images/2.jpg"></figure>
  <figure><img src="images/3.jpg"></figure>
  <figure><img src="images/3-1.jpg"></figure>
</div>

<!-- Day 2 -->
<h2>Day 2</h2>
<div class="gallery">
  <figure><img src="images/4.jpg"></figure>
  <figure><img src="images/5.jpg"></figure>
  <figure><img src="images/6.jpg"></figure>
  <figure><img src="images/7.jpg"></figure>
  <figure><img src="images/8.jpg"></figure>
  <figure><img src="images/9.jpg"></figure>
  <figure><img src="images/9-1.jpg"></figure>
  <figure><img src="images/10.jpg"></figure>
  <figure><img src="images/11.jpg"></figure>
</div>

<!-- Day 3 -->
<h2>Day 3</h2>
<div class="gallery">
  <figure><img src="images/12.jpg"></figure>
  <figure><img src="images/13.jpg"></figure>
  <figure><img src="images/14.jpg"></figure>
  <figure><img src="images/15.jpg"></figure>
</div>

</body>
</html>
