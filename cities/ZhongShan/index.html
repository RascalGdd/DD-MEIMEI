<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中山</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      color: #333;
      background: #fbfbf8;
    }

    a {
      color: #2f7d44;
      text-decoration: none;
    }

    h1 {
      margin-bottom: 6px;
    }

    .summary {
      color: #666;
      margin-top: 0;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    h2 {
      margin-top: 40px;
      margin-bottom: 10px;
      border-left: 4px solid #4caf50;
      padding-left: 10px;
      color: #333;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      align-items: start;
    }

    figure {
      margin: 0;
    }

    figure img {
      width: 100%;
      border-radius: 8px;
      display: block;
      background: #eee;
    }

    figcaption {
      margin-top: 6px;
      font-size: 14px;
      color: #555;
      line-height: 1.4;
    }
  </style>
</head>
