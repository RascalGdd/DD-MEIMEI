<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DD and HH Travel Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <link rel="stylesheet" href="assets/site.css" />

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.78);
      --glass-shadow: 0 20px 60px rgba(36, 30, 20, 0.18);
      --text: #252521;
      --muted: #756f64;
      --item-hover: rgba(75, 139, 98, 0.1);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Inter, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #efe9dc;
    }

    body.map-home::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 900;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(245, 238, 224, 0.78), transparent 42%),
        linear-gradient(180deg, rgba(37, 37, 33, 0.18), transparent 36%, rgba(37, 37, 33, 0.22));
      mix-blend-mode: multiply;
    }

    .title {
      position: fixed;
      top: 22px;
      right: 24px;
      z-index: 1200;
      color: rgba(37, 37, 33, 0.86);
      font-size: clamp(18px, 3vw, 34px);
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: 0 2px 18px rgba(255, 255, 255, 0.75);
      user-select: none;
      pointer-events: none;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    .leaflet-tile-pane {
      filter: saturate(0.76) contrast(1.02) sepia(0.13);
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(36, 30, 20, 0.22);
    }

    .leaflet-popup-content {
      margin: 0;
    }

    #sidebar {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 1300;
      width: min(360px, calc(100vw - 32px));
      max-height: calc(100vh - 44px);
      padding: 18px;
      color: var(--text);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      box-shadow: var(--glass-shadow);
      overflow: hidden;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    #sidebar .sidebar-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    #sidebar h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0;
    }

    #sidebar .count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    #sidebar .hint {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    #city-list-wrap {
      max-height: calc(100vh - 150px);
      padding-right: 4px;
      overflow-y: auto;
    }

    #city-list-wrap::-webkit-scrollbar {
      width: 8px;
    }

    #city-list-wrap::-webkit-scrollbar-thumb {
      background: rgba(75, 139, 98, 0.26);
      border-radius: 10px;
    }

    #city-list-wrap::-webkit-scrollbar-track {
      background: rgba(37, 37, 33, 0.05);
      border-radius: 10px;
    }

    #city-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #city-list li {
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 10px;
      min-height: 82px;
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid rgba(37, 37, 33, 0.08);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.56);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    #city-list li:hover {
      background: var(--item-hover);
      box-shadow: 0 14px 30px rgba(36, 30, 20, 0.12);
      transform: translateY(-2px);
    }

    .city-thumb {
      width: 74px;
      height: 66px;
      border-radius: 8px;
      object-fit: cover;
      background: #ded8cc;
    }

    .city-name {
      display: block;
      margin-bottom: 5px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .city-meta,
    .city-note {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .city-note {
      margin-top: 4px;
      color: rgba(37, 37, 33, 0.72);
    }

    .city-popup {
      width: 220px;
      overflow: hidden;
      border-radius: 14px;
      background: #fffdf8;
    }

    .city-popup img {
      display: block;
      width: 100%;
      height: 130px;
      object-fit: cover;
    }

    .city-popup__body {
      padding: 12px;
    }

    .city-popup strong {
      display: block;
      margin-bottom: 4px;
      color: #252521;
      font-size: 17px;
    }

    .city-popup span {
      display: block;
      color: #756f64;
      font-size: 12px;
      line-height: 1.4;
    }

    .city-popup a {
      display: inline-flex;
      margin-top: 10px;
      color: #1f5f42;
      font-weight: 700;
      text-decoration: none;
    }

    .visited-marker {
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-radius: 999px;
      background: #4b8b62;
      box-shadow: 0 0 0 6px rgba(75, 139, 98, 0.18), 0 10px 22px rgba(31, 95, 66, 0.24);
    }

    @media (max-width: 620px) {
      .title {
        top: 14px;
        right: 14px;
      }

      #sidebar {
        top: auto;
        bottom: 12px;
        left: 12px;
        width: calc(100vw - 24px);
        max-height: 48vh;
      }

      #city-list-wrap {
        max-height: calc(48vh - 104px);
      }
    }
  </style>
</head>

<body class="map-home">
  <div class="title">DD and HH · Travel Notes</div>

  <div id="map"></div>

  <div id="sidebar">
    <div class="sidebar-header">
      <h2>Visited</h2>
      <div class="count" id="visited-count">0</div>
    </div>
    <p class="hint">A small map of places, meals, concerts, and days worth keeping.</p>
    <div id="city-list-wrap">
      <ul id="city-list"></ul>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="map.js"></script>
</body>
</html>
